services:
  quizabend:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATA_DIR: /data
      # Optional: feste LAN-Adresse für QR-Codes, z. B. http://192.168.178.20:3000
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - quizabend-data:/data
    restart: unless-stopped
volumes:
  quizabend-data:
